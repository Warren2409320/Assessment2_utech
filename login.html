<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Q1(b): Login Page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Gears | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <div class="brand">
                <img src="logo.png" alt="Titan Gears logo" class="logo">
                <h1>Titan Gears</h1>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="checkout.html">Checkout</a></li>
                    <li><a href="invoice.html">Invoice</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <section class="form-box">
            <h2>Login</h2>

            <form id="loginForm">
                <label for="trnLogin">TRN</label>
                <input
                    type="text"
                    id="trnLogin"
                    placeholder="Enter TRN (000-000-000)"
                    maxlength="11"
                    required
                >

                <label for="passwordLogin">Password</label>
                <input
                    type="password"
                    id="passwordLogin"
                    placeholder="Enter your password"
                    required
                >

                <div class="button-group">
                    <button type="button" class="btn" onclick="validateLogin()">Login</button>
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                </div>

                <a href="#" class="reset-link" onclick="resetPassword()">Reset Password</a>

                <p id="loginMessage" class="form-message"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Titan Gears. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
