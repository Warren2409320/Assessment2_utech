<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Q1(a): Registration Page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Gears | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <div class="brand">
                <img src="logo.png" alt="Titan Gears logo" class="logo">
                <h1>Titan Gears</h1>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="checkout.html">Checkout</a></li>
                    <li><a href="invoice.html">Invoice</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <section class="form-box">
            <h2>Register</h2>

            <form id="registerForm">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="Enter first name" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>

                <label for="emailReg">Email</label>
                <input type="email" id="emailReg" placeholder="Enter your email" required>

                <label for="trn">TRN</label>
                <input type="text" id="trn" placeholder="000-000-000" maxlength="11" required>

                <label for="passwordReg">Password</label>
                <input type="password" id="passwordReg" placeholder="Minimum 8 characters" required>

                <div class="button-row">
                    <button type="button" class="btn" onclick="validateRegister()">Register</button>
                    <button type="reset" class="btn btn-cancel">Cancel</button>
                </div>

                <p id="registerMessage" class="form-message"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Titan Gears. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
