<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Gears | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <div class="brand">
                <img src="../Assets/logo.png" alt="Titan Gears logo" class="logo">
                <h1>Titan Gears</h1>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="checkout.html">Checkout</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html" class="active">Register</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <section class="form-box">
            <h2>Register</h2>
            <form id="registerForm">
                <label for="fullNameReg">Full Name</label>
                <input type="text" id="fullNameReg" placeholder="Enter full name">

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">

                <label for="emailReg">Email</label>
                <input type="email" id="emailReg" placeholder="Enter your email">

                <label for="usernameReg">Username</label>
                <input type="text" id="usernameReg" placeholder="Choose a username">

                <label for="passwordReg">Password</label>
                <input type="password" id="passwordReg" placeholder="Choose a password">

                <button type="button" class="btn" onclick="validateRegister()">Register</button>
                <p id="registerMessage"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Titan Gears. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
