<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Gears | Checkout</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body onload="loadCheckoutSummary()">
    <header>
        <div class="container nav-container">
            <div class="brand">
                <img src="../Assets/logo.png" alt="Titan Gears logo" class="logo">
                <h1>Titan Gears</h1>
            </div>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="checkout.html" class="active">Checkout</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <h2>Checkout</h2>

        <section class="checkout-box">
            <h3>Order Summary</h3>
            <p>Total Cost: JMD <span id="checkout-total">0</span></p>
        </section>

        <section class="form-box">
            <h3>Shipping Details</h3>
            <form id="checkoutForm">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name">

                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter shipping address">

                <label for="amountPaid">Amount Being Paid</label>
                <input type="number" id="amountPaid" placeholder="Enter amount">

                <div class="button-group">
                    <button type="button" class="btn" onclick="confirmOrder()">Confirm</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelOrder()">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="clearCart()">Clear All</button>
                    <button type="button" class="btn btn-dark" onclick="window.close()">Close</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Titan Gears. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
